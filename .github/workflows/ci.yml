name: Core verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check public source, complete results, and navigation
        run: python scripts/check_repository.py
      - name: Test interface
        run: python -m unittest discover -s tests -v
      - name: Test installed package outside source tree
        run: |
          python -m pip install --no-deps .
          cd "$RUNNER_TEMP"
          bbcover --version
          bbcover compare upper
          bbcover results DIST-UPPER
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - name: Rebuild four independent exact certificates
        run: python scripts/reproduce.py --profile core --output checks/ci-core
      - name: Retain logs, matrices, and circuit comparisons
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: exact-certificate-audit
          path: checks/ci-core/
          if-no-files-found: warn
          retention-days: 14
