name: Extended research audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the explicit research dependency
        run: |
          python -m pip install -r requirements-research.txt
          g++ --version
      - name: Regenerate core certificates and execute retained branch audits
        run: python scripts/reproduce.py --profile extended --output checks/ci-extended --timeout 300
      - name: Verify homology and class-metric history
        run: python scripts/verify_homology_history.py --output checks/ci-extended/homology-history
      - name: Retain audit evidence, not temporary compiled workspaces
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: extended-research-audit
          path: |
            checks/ci-extended/
            !checks/ci-extended/**/work/**
          if-no-files-found: warn
          retention-days: 30
